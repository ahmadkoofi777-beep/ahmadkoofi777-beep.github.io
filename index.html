
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سایت شخصی من</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      text-align: center;
    }
    header {
      background: #0f172a;
      color: white;
      padding: 45px 15px;
    }
    section {
      background: white;
      margin: 20px;
      padding: 25px;
      border-radius: 16px;
    }
    a {
      display: inline-block;
      background: #0891b2;
      color: white;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>به سایت شخصی من خوش آمدید</h1>
    <p>این صفحهٔ شخصی من است.</p>
  </header>
  <section>
    <h2>دربارهٔ من</h2>
    <p>به‌زودی معلومات و معرفی خودم را اینجا اضافه می‌کنم.</p>
  </section>
  <section>
    <h2>لینک‌های من</h2>
    <a href="#contact">تماس با من</a>
  </section>
  <section id="contact">
    <h2>تماس با من</h2>
    <p>به‌زودی معلومات تماس را اضافه می‌کنم.</p>
  </section>
</body>
</html>
